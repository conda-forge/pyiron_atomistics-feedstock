schema_version: 1

context:
  name: pyiron_atomistics
  version: "0.8.11"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 780ee7c3f1a2685037919d7d7dd2db0395196d83fcbf5a2dbb5d31a44715b292

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - ase
    - atomistics
    - defusedxml
    - h5py
    - matplotlib-base
    - mendeleev
    - mp-api
    - numpy
    - pandas
    - phonopy
    - pint
    - lammpsparser
    - pyiron_base
    - pyiron_snippets
    - vaspparser
    - pylammpsmpi
    - pyscal3
    - scipy
    - scikit-learn
    - seekpath
    - spglib
    - structuretoolkit
    - hatchling
    - hatch-vcs
    - sphinx_parser
  run:
    - python >=${{ python_min }},<3.14
    - ase >=3.23.0,<=3.29.0
    - assyst >=0.9.0,<=0.15.0
    - atomistics >=0.3.0,<=0.3.8
    - defusedxml >=0.7.0,<=0.7.1
    - h5py >=3.12.1,<=3.16.0
    - matplotlib-base >=3.9.1,<=3.11.1
    - mendeleev =1.1.0
    - mp-api >=0.37.0,<=0.46.4
    - numpy >=2.2.1,<=2.4.3
    - pandas >=2.2.3,<=2.3.3
    - phonopy >=2.26.6,<=4.4.0
    - pint >=0.24.4,<=0.25.2
    - pyiron_base >=0.15.4,<=0.15.16
    - lammpsparser >=0.0.1,<=0.0.7
    - pyiron_snippets >=1.0.1,<=1.4.0
    - vaspparser >=0.0.1,<=0.0.7
    - pylammpsmpi >=0.2.36,<=0.3.12
    - pyscal3 >=3.2.5,<=3.3.2
    - scipy >=1.15.0,<=1.17.1
    - scikit-learn >=1.4.2,<=1.9.0
    - seekpath >=1.9.5,<=2.2.1
    - spglib >=2.5.0,<=2.7.0
    - structuretoolkit >=0.0.35,<=0.0.45
    - sphinx_parser =0.1.9

tests:
  - python:
      imports:
        - pyiron_atomistics
      pip_check: true

      python_version: ${{ python_min }}.*
about:
  summary: pyiron - an integrated development environment (IDE) for computational materials science.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/pyiron_atomistics

extra:
  recipe-maintainers:
    - niklassiemer
    - srmnitc
    - pyiron-runner
    - jan-janssen
    - pmrv
